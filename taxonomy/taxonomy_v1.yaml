# =============================================================================
# SIP Insight Lab — Research Taxonomy
# Version : 1.0
# Status  : FROZEN (approved for Phase 0)
# Owner   : Growth PM, Groww
# Updated : 2026-10-31
#
# RULES:
#   - Do NOT edit this file directly once frozen.
#   - To update, create taxonomy_v2.yaml and bump `version`.
#   - Every LABELLED_ITEM in the DB must store the `taxonomy_version` it used.
# =============================================================================

version: "1.0"
frozen: true

# ---------------------------------------------------------------------------
# Investor Lifecycle Stages
# When in the SIP journey did the investor write this feedback?
# ---------------------------------------------------------------------------
lifecycle_stages:
  - code: LS-00
    label: pre_first_sip
    description: >
      Investor has not yet started a SIP; feedback relates to the
      onboarding or decision phase.

  - code: LS-01
    label: 0_3mo
    description: >
      Investor is in the first 0–3 months of their first SIP.
      Highest risk window for early churn.

  - code: LS-02
    label: 3_6mo
    description: >
      Investor is between 3 and 6 months into their first SIP.
      Return expectations begin to diverge from reality.

  - code: LS-03
    label: 6_12mo
    description: >
      Investor is between 6 and 12 months into their first SIP.

  - code: LS-04
    label: 12mo_plus
    description: >
      Investor has crossed the 12-month mark. SIP is considered
      "retained" per the business goal definition.

  - code: LS-99
    label: unknown
    description: >
      Lifecycle stage cannot be inferred from the feedback text.

# ---------------------------------------------------------------------------
# Stop Types
# Was the SIP ending a conscious choice or an involuntary lapse?
# ---------------------------------------------------------------------------
stop_types:
  - code: ST-01
    label: involuntary_lapse
    description: >
      The SIP ended or paused without a deliberate decision by the investor.
      Examples: debit failure, mandate rejection, auto-cancellation after
      3 missed instalments, bank technical error.

  - code: ST-02
    label: deliberate_exit
    description: >
      The investor made a conscious, active decision to stop or pause the SIP.
      Examples: goal achieved, switching platforms, chosen pause for liquidity.

  - code: ST-03
    label: not_applicable
    description: >
      The investor has NOT stopped. Feedback is from a continuing investor.

  - code: ST-99
    label: unknown
    description: >
      Cannot determine from feedback text whether the stop was
      involuntary or deliberate.

# ---------------------------------------------------------------------------
# Stated Intent
# What did the investor SAY they would do? (separate from actual_action)
# ---------------------------------------------------------------------------
stated_intents:
  - continue
  - pause
  - stop
  - neutral     # No clear forward-looking intent stated
  - unknown     # Cannot be inferred

# ---------------------------------------------------------------------------
# Actual Action
# What did the investor ACTUALLY do? (separate from stated_intent)
# ---------------------------------------------------------------------------
actual_actions:
  - active      # SIP is still running
  - paused      # SIP is temporarily on hold
  - cancelled   # SIP has been permanently stopped
  - unknown     # Cannot be inferred from the feedback

# ---------------------------------------------------------------------------
# Root Causes
# Why did the investor stop, pause, or struggle with their SIP?
# (Also used for retention analysis — what kept continuers going)
# ---------------------------------------------------------------------------
root_causes:
  - code: RC-01
    label: Involuntary Lapse
    addressable: true
    description: >
      SIP ended due to a technical or procedural failure, not a deliberate
      investor choice.
    subcategories:
      - label: Insufficient balance
        description: >
          Bank account did not have enough funds on the SIP debit date.
      - label: Bank mandate failure
        description: >
          NACH / e-mandate was rejected or expired.
      - label: Auto-cancellation after 3 misses
        description: >
          Groww or the AMC auto-cancelled the SIP after consecutive
          failed debits.
      - label: Payment gateway / technical error
        description: >
          Platform-side technical failure caused a missed instalment.

  - code: RC-02
    label: UX & Payment Friction
    addressable: true
    description: >
      The app interface, onboarding flow, or payment process confused or
      frustrated the investor enough to cause churn or near-churn.
    subcategories:
      - label: Confusing interface
        description: App navigation or information hierarchy was unclear.
      - label: Payment gateway failure
        description: Payment flow failed at the gateway level.
      - label: KYC / documentation issues
        description: KYC hurdles delayed or blocked the investor.
      - label: Difficult SIP modification flow
        description: Investor could not easily pause, modify, or cancel a SIP.

  - code: RC-03
    label: Return Disappointment
    addressable: true
    description: >
      The investor's actual returns fell short of expectations set by
      calculators, finfluencers, friends, or advertising.
    subcategories:
      - label: Calculator mismatch
        description: SIP calculator showed higher returns than reality.
      - label: Finfluencer promise gap
        description: >
          Social media influencer set unrealistic return expectations.
      - label: Market downturn fear
        description: >
          A market correction triggered fear and premature SIP cancellation.
      - label: Short-term return focus
        description: >
          Investor evaluated a long-term instrument over too short a window.

  - code: RC-04
    label: Income Change
    addressable: false
    description: >
      A genuine change in the investor's financial situation forced a
      reduction or cancellation of the SIP.
    subcategories:
      - label: Job loss
      - label: Salary reduction
      - label: Emergency expense
      - label: Increased fixed obligations

  - code: RC-05
    label: Deliberate Informed Exit
    addressable: false
    description: >
      The investor made a well-informed, rational decision to stop or switch.
      This is not a product failure.
    subcategories:
      - label: Goal achieved
      - label: Fund switch (same platform)
      - label: Platform switch
      - label: Redemption for planned goal

  - code: RC-06
    label: Knowledge Gap
    addressable: true
    description: >
      The investor lacked understanding of how SIPs, NAV, or mutual funds
      work, leading to incorrect expectations or premature exit.
    subcategories:
      - label: Did not understand SIP mechanics
      - label: Confused about NAV calculation
      - label: Did not understand market volatility is normal
      - label: Did not know how to read fund performance

  - code: RC-07
    label: External Influence
    addressable: true
    description: >
      The investor's decision was heavily shaped by external voices —
      peers, family, or finfluencers — rather than personal analysis.
    subcategories:
      - label: Peer advice (positive)
      - label: Peer advice (negative / stop advice)
      - label: Finfluencer recommendation (positive)
      - label: Finfluencer recommendation (negative / switch advice)
      - label: Family pressure

  - code: RC-99
    label: Unclassifiable
    addressable: false
    description: >
      Feedback does not contain enough information to assign a root cause.

# ---------------------------------------------------------------------------
# Retention Factors
# For investors who CONTINUED — what kept them going?
# ---------------------------------------------------------------------------
retention_factors:
  - code: RF-01
    label: Seeing positive returns (even small)
    description: >
      Even modest positive returns reinforced the investor's conviction
      and kept them invested.

  - code: RF-02
    label: Community / peer encouragement
    description: >
      Friends, family, or online communities validated the decision
      to continue.

  - code: RF-03
    label: App nudges or reminders
    description: >
      In-app notifications, milestone celebrations, or reminders helped
      the investor stay on track.

  - code: RF-04
    label: Long-term goal tracking visible
    description: >
      Seeing progress toward a named goal (e.g., "Emergency Fund",
      "House Down Payment") provided motivation.

  - code: RF-05
    label: Educational content within app
    description: >
      In-app articles, tooltips, or explainers helped the investor
      understand volatility and stay patient.

  - code: RF-06
    label: Automated / hassle-free experience
    description: >
      The "set it and forget it" nature of SIPs made it easy to continue
      without active effort.

  - code: RF-07
    label: Rupee cost averaging understanding
    description: >
      The investor understood (or was taught) that buying at lower NAV
      during dips is beneficial.

  - code: RF-99
    label: Unknown / not stated
    description: Retention factor cannot be inferred from the text.

# ---------------------------------------------------------------------------
# Investor Segments
# Demographic and behavioural dimensions for cross-tab analysis.
# ---------------------------------------------------------------------------
investor_segments:
  age_groups:
    - "18-24"
    - "25-30"
    - "31-40"
    - "41-50"
    - "51+"
    - "unknown"

  income_stability:
    - salaried_stable      # Regular monthly salary
    - salaried_variable    # Commission / bonus-heavy income
    - self_employed        # Business / freelance income
    - student              # No primary income
    - unknown

  money_source:
    - own_savings          # Investor's own accumulated savings
    - salary_emi           # Monthly salary earmarked for SIP
    - gift_windfall        # Received as gift or windfall
    - borrowed             # Borrowed to invest (high-risk signal)
    - unknown

  influencer_type:
    - finfluencer_youtube  # YouTube personal finance creator
    - finfluencer_instagram
    - finfluencer_twitter_x
    - peer_friend
    - family
    - financial_advisor    # SEBI-registered advisor
    - self_research        # No external influence
    - unknown

# ---------------------------------------------------------------------------
# Help Sources
# Where did the investor go for help OUTSIDE the Groww app?
# ---------------------------------------------------------------------------
help_sources:
  - reddit
  - youtube
  - tradingqa
  - peer_friend
  - financial_advisor
  - groww_customer_support
  - google_search
  - other
  - none_mentioned

# ---------------------------------------------------------------------------
# Confidence Threshold (Task 0.6)
# Items below this threshold are routed to human review.
# ---------------------------------------------------------------------------
classification_config:
  confidence_threshold: 0.75
  human_review_sla_hours: 48
  min_golden_set_size: 20
  target_overall_accuracy: 0.80
  target_per_field_f1: 0.75
  max_human_review_rate: 0.20
